name: Usage report

# How the app is used, from the anonymous daily totals the app sends
# (functions/main.py usage). Prints sums only; nothing names anyone.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/usage-report.yml']

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Daily totals and the first-week picture
        run: |
          pip install -q google-cloud-firestore
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from google.cloud import firestore
          db = firestore.Client(project='homefairy-dev')
          days = sorted((d.id, d.to_dict()) for d in db.collection('stats').stream())[-21:]
          print('## Usage (anonymous daily totals)  ')
          print('| day | phones | added | searches found | not found | with map | signed in | family |')
          print('|---|---|---|---|---|---|---|---|')
          ages = {}
          for day, s in days:
              print(f"| {day} | {s.get('reports',0)} | {s.get('added',0)} | {s.get('found',0)} | {s.get('empty',0)} | {s.get('withMap',0)} | {s.get('signedIn',0)} | {s.get('shared',0)} |")
              for a, v in (s.get('age') or {}).items():
                  t = ages.setdefault(int(a), [0, 0, 0, 0, 0])
                  t[0] += v.get('n', 0); t[1] += v.get('items', 0); t[2] += v.get('items20', 0)
                  t[3] += v.get('rooms', 0); t[4] += v.get('spots', 0)
          keys = ['intro', 'guest', 'login', 'template', 'receipt', 'photo', 'barcode', 'fairy', 'invite', 'join', 'plusOpen', 'buyStart', 'buyDone']
          tot = {k: sum((s.get(k) or 0) for _, s in days) for k in keys}
          print('\n### Steps and features, all days  ')
          print('| ' + ' | '.join(keys) + ' |')
          print('|' + '---|' * len(keys))
          print('| ' + ' | '.join(str(tot[k]) for k in keys) + ' |')
          print('\n### By days since install  ')
          print('| day | reports | avg rooms | avg spots | avg things | with 20+ things |')
          print('|---|---|---|---|---|---|')
          for a in sorted(ages):
              n, items, over, rooms, spots = ages[a]
              print(f'| {a} | {n} | {rooms / n:.1f} | {spots / n:.1f} | {items / n:.1f} | {over / n:.0%} |' if n else f'| {a} | 0 | – | – | – | – |')
          PY
