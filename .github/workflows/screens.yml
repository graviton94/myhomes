name: Screens

# Screenshots of every screen in English/Korean, light/dark (golden tests, no emulator).
# Run by hand after a batch of patches; download the "screens" artifact to review.
on:
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: app/test/goldens/screens/*.png
