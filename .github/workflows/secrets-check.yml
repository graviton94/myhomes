name: Secrets check

# Checks that the Actions secrets are usable without printing them.
# Prints only public facts: Firebase project id, package names, whether SHA fingerprints are registered,
# API result codes, passphrase lengths.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOD: ${{ secrets.FOOD_API_KEY }}
          P_SIDE: ${{ secrets.SIDELOAD_PASSPHRASE }}
          P_UP: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request, urllib.error, urllib.parse, time, base64, subprocess, tempfile
          PKG = "io.github.graviton94.homefairy"
          bad = []
          def say(s): print(s + "  ")

          say("## Passphrases")
          a, b = os.environ.get("P_SIDE", ""), os.environ.get("P_UP", "")
          say(f"- SIDELOAD_PASSPHRASE: {'set' if a else 'MISSING'}, {len(a)} chars {'(ok)' if len(a) >= 16 else '(needs 16+)'}")
          say(f"- ANDROID_UPLOAD_PASSPHRASE: {'set' if b else 'MISSING'}, {len(b)} chars {'(ok)' if len(b) >= 16 else '(needs 16+)'}")
          if len(a) < 16 or len(b) < 16: bad.append("passphrase")
          if a and a == b: say("- the two passphrases are the same (they must differ)"); bad.append("same passphrase")

          say("## GOOGLE_SERVICES_JSON")
          gproj = None
          try:
              g = json.loads(os.environ.get("GSJ", ""))
              gproj = g["project_info"]["project_id"]
              say(f"- valid JSON, project_id `{gproj}`, project_number `{g['project_info'].get('project_number')}`")
              clients = g.get("client", [])
              pkgs = [c["client_info"]["android_client_info"]["package_name"] for c in clients]
              say(f"- apps in file: {', '.join('`'+p+'`' for p in pkgs)}")
              mine = [c for c in clients if c["client_info"]["android_client_info"]["package_name"] == PKG]
              if not mine: say(f"- **no app with package `{PKG}`**"); bad.append("package")
              else:
                  c = mine[0]
                  hashes = [o.get("android_info", {}).get("certificate_hash") for o in c.get("oauth_client", []) if o.get("client_type") == 1]
                  say(f"- `{PKG}` found; Android OAuth clients with SHA-1: {len([h for h in hashes if h])} (0 is fine until Google sign-in)")
                  say(f"- API key present: {'yes' if c.get('api_key') else 'no'}")
          except Exception as e:
              say(f"- **not usable**: {type(e).__name__}"); bad.append("google-services")

          say("## FIREBASE_SERVICE_ACCOUNT")
          try:
              s = json.loads(os.environ.get("SA", ""))
              say(f"- valid JSON, type `{s.get('type')}`, project_id `{s.get('project_id')}`, account `{s.get('client_email')}`")
              if gproj and s.get("project_id") != gproj: say("- **project differs from google-services.json**"); bad.append("sa project")
              with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as f: json.dump(s, f); kp = f.name
              ok = subprocess.run(["gcloud", "auth", "activate-service-account", f"--key-file={kp}", "--quiet"], capture_output=True).returncode == 0
              tok = subprocess.run(["gcloud", "auth", "print-access-token"], capture_output=True, text=True).stdout.strip() if ok else ""
              os.remove(kp)
              say(f"- key accepted by Google: {'yes' if tok else 'no'}")
              if not tok: bad.append("sa auth")
              else:
                  req = urllib.request.Request(f"https://firestore.googleapis.com/v1/projects/{s['project_id']}/databases", headers={"Authorization": "Bearer " + tok})
                  try:
                      dbs = json.load(urllib.request.urlopen(req, timeout=20)).get("databases", [])
                      say(f"- Firestore databases: {', '.join(d['name'].split('/')[-1] + ' @ ' + d.get('locationId', '?') for d in dbs) or 'none yet'}")
                  except urllib.error.HTTPError as e:
                      say(f"- Firestore list: HTTP {e.code} (403 = account lacks a Firestore/Firebase admin role, or API not enabled)")
          except Exception as e:
              say(f"- **not usable**: {type(e).__name__}"); bad.append("service account")

          say("## FOOD_API_KEY (식약처 C005)")
          k = os.environ.get("FOOD", "")
          if not k: say("- MISSING"); bad.append("food")
          for scheme in ("https", "http"):
              if not k: break
              url = f"{scheme}://openapi.foodsafetykorea.go.kr/api/{urllib.parse.quote(k)}/C005/json/1/1/BAR_CD=8801043015653"
              try:
                  body = json.load(urllib.request.urlopen(url, timeout=20))
                  r = body.get("C005", body).get("RESULT", body.get("RESULT", {}))
                  say(f"- {scheme}: {r.get('CODE')} {r.get('MSG')} (INFO-000 or INFO-200 = key works)")
              except Exception as e:
                  say(f"- {scheme}: failed ({type(e).__name__}: {str(e)[:80].replace(k, '***')})")

          say("")
          say("**Result: " + ("all usable**" if not bad else "problems: " + ", ".join(bad) + "**"))
          PY
