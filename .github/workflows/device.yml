name: Device smoke test

# The real app on an Android emulator: first launch, a home from a template,
# the map editor's gestures, tabs and Settings (app/integration_test).
# Run by hand, or when the test itself changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/integration_test/**'
      - '.github/workflows/device.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Let the runner use hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: app
          script: flutter test integration_test/smoke_test.dart -d emulator-5554 --timeout 12m
