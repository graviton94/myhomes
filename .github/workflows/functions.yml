name: Functions

# Deploys Cloud Functions (functions/) to homefairy-dev and smoke-tests them.
# The Jev key goes from the JEV_API_KEY Actions secret into Secret Manager;
# nothing secret is printed.
on:
  push:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

env:
  PROJECT: homefairy-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Icons match the app
        working-directory: app/packages/core
        run: dart pub get >/dev/null && dart run tool/export_icons.dart --check

      - name: Enable APIs (fails here if the project is not on Blaze or the account lacks rights)
        run: |
          if ! out=$(gcloud services enable --project "$PROJECT" \
            cloudfunctions.googleapis.com run.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com secretmanager.googleapis.com eventarc.googleapis.com \
            identitytoolkit.googleapis.com firebaseappcheck.googleapis.com iamcredentials.googleapis.com \
            firestore.googleapis.com firebaserules.googleapis.com cloudscheduler.googleapis.com androidpublisher.googleapis.com 2>&1); then
            echo "$out" | grep -E "permission:|reason:|billing|Billing|FAILED_PRECONDITION" | sort -u | head -10
            echo "::error::Could not enable the APIs. The service account needs the Service Usage Admin role, and the project must be on Blaze."
            exit 1
          fi
          echo "APIs enabled"

      - name: Keys into Secret Manager (Jev, food-safety barcodes)
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          FOOD_API_KEY: ${{ secrets.FOOD_API_KEY }}
        run: |
          for name in JEV_API_KEY FOOD_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then echo "$name: not set in GitHub secrets"; continue; fi
            if ! gcloud secrets describe "$name" --project "$PROJECT" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project "$PROJECT" --replication-policy=automatic
            fi
            current=$(gcloud secrets versions access latest --secret="$name" --project "$PROJECT" 2>/dev/null || true)
            if [ "$current" != "$value" ]; then
              printf %s "$value" | gcloud secrets versions add "$name" --project "$PROJECT" --data-file=- >/dev/null
              echo "$name: new version added"
            else
              echo "$name: unchanged"
            fi
          done

      - name: Python environment for the functions
        working-directory: functions
        run: |
          python3 -m venv venv
          venv/bin/pip install -q -r requirements.txt
          venv/bin/python -c "import main" && echo "functions import ok"

      # Settings the functions read from their env (not secret): our Kakao app's
      # numeric id, so a token made for another Kakao app is refused.
      - name: Functions env
        env:
          KAKAO_APP_ID: ${{ secrets.KAKAO_APP_ID }}
        run: |
          : > functions/.env
          if [ -n "$KAKAO_APP_ID" ]; then
            echo "KAKAO_APP_ID=$KAKAO_APP_ID" >> functions/.env
            echo "Kakao app id: set (tokens from other apps are refused)"
          else
            echo "::warning::KAKAO_APP_ID is not set in GitHub secrets: Kakao tokens are checked to be valid, but not that they were made for this app."
          fi

      - name: Deploy
        run: |
          npx -y firebase-tools deploy --project "$PROJECT" --non-interactive --force \
            --only functions:decide,functions:household,functions:login,functions:barcode,functions:purchase

      # The evening family digest runs on Cloud Scheduler, which needs the deploy
      # account to have the Cloud Scheduler Admin role; without it only the digest is missing.
      - name: Deploy the evening digest (scheduled)
        continue-on-error: true
        shell: bash
        run: |
          if ! npx -y firebase-tools deploy --project "$PROJECT" --non-interactive --force --only functions:digest 2>&1 | tee digest.log; then
            grep -iE "permission|403" digest.log | head -3
            echo "::warning::The evening family digest is not deployed. Give the deploy service account (FIREBASE_SERVICE_ACCOUNT) the Cloud Scheduler Admin role."
            exit 1
          fi

      - name: Firestore rules (who may read and write shared homes)
        shell: bash
        run: |
          if ! npx -y firebase-tools deploy --only firestore:rules --project "$PROJECT" --non-interactive 2>&1 | tee rules.log; then
            grep -iE "permission|denied|403" rules.log | head -5
            echo "::error::Could not deploy Firestore rules. Give the deploy service account (FIREBASE_SERVICE_ACCOUNT) the Firebase Rules Admin role in Google Cloud IAM."
            exit 1
          fi

      - name: Who may call the function (callable functions need allUsers as invoker; the function checks sign-in itself)
        run: |
          gcloud run services get-iam-policy decide --region us-central1 --project "$PROJECT" \
            --format='value(bindings.role,bindings.members)' 2>&1 | tail -5 || true

      - name: Can the functions sign login tokens? (their service account needs Service Account Token Creator on itself)
        run: |
          num=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          sa="$num-compute@developer.gserviceaccount.com"
          # Invite this account in Play Console (Users and permissions) so the purchase function can check purchases.
          echo "Functions run as: $sa" | tee -a "$GITHUB_STEP_SUMMARY"
          roles=$(gcloud iam service-accounts get-iam-policy "$sa" --project "$PROJECT" --format=json 2>/dev/null \
            | python3 -c "import json,sys; print(' '.join(b['role'] for b in json.load(sys.stdin).get('bindings', []) if any('$sa' in m for m in b['members'])))" || true)
          proj=$(gcloud projects get-iam-policy "$PROJECT" --flatten='bindings[].members' --filter="bindings.members:serviceAccount:$sa" --format='value(bindings.role)' 2>/dev/null | tr '\n' ' ' || true)
          echo "on the account: ${roles:-none}"; echo "on the project: ${proj:-none}"
          if ! echo "$roles $proj" | grep -q 'roles/iam.serviceAccountTokenCreator'; then
            echo "::warning::$sa lacks Service Account Token Creator; Kakao and Naver login will fail."
          fi

      - name: Smoke test (an account gets answers; a guest and a stranger do not)
        working-directory: functions
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          venv/bin/python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, time, urllib.request, urllib.error
          import firebase_admin
          from firebase_admin import auth
          project = os.environ['PROJECT']
          key = json.loads(os.environ['GSJ'])['client'][0]['api_key'][0]['current_key']
          tok = subprocess.run(['gcloud', 'auth', 'print-access-token'], capture_output=True, text=True).stdout.strip()
          firebase_admin.initialize_app(options={'projectId': project})

          def call(url, body, headers=None, wait=False):
              # Right after a deploy the public invoker binding can take a minute to apply.
              for attempt in range(12 if wait else 1):
                  req = urllib.request.Request(url, json.dumps(body).encode(), {'Content-Type': 'application/json', **(headers or {})})
                  try:
                      return 200, json.load(urllib.request.urlopen(req, timeout=60))
                  except urllib.error.HTTPError as e:
                      text = e.read().decode()[:300]
                      if wait and e.code in (401, 403) and '<html' in text:
                          time.sleep(10); continue
                      return e.code, text
              return e.code, text

          print('## Functions smoke test  ')
          # Guests sign in anonymously (barcodes); turn that sign-in method on if it is off.
          req = urllib.request.Request(
              f'https://identitytoolkit.googleapis.com/admin/v2/projects/{project}/config?updateMask=signIn.anonymous.enabled',
              json.dumps({'signIn': {'anonymous': {'enabled': True}}}).encode(),
              {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok, 'X-Goog-User-Project': project},
              method='PATCH')
          try:
              urllib.request.urlopen(req, timeout=30); print('- anonymous sign-in: on  ')
          except urllib.error.HTTPError as e:
              print(f'- anonymous sign-in: could not turn on (HTTP {e.code}) — enable it in Firebase console → Authentication  ')
          uid = 'test:ci-smoke'
          try: auth.update_user(uid, display_name='CI smoke')
          except auth.UserNotFoundError: auth.create_user(uid=uid, display_name='CI smoke')
          code, user = call(f'https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key={key}',
                            {'token': auth.create_custom_token(uid).decode(), 'returnSecureToken': True})
          if code != 200:
              print(f'- account sign-in failed: HTTP {code}  '); raise SystemExit(1)
          account = {'Authorization': 'Bearer ' + user['idToken']}
          url = f'https://us-central1-{project}.cloudfunctions.net/decide'
          ok = True
          for body in ({'task': 'classify', 'name': '타이레놀'}, {'task': 'classify', 'name': '타이레놀'}, {'task': 'classify', 'name': '청바지'},
                       {'task': 'find', 'query': '해열제', 'items': ['타이레놀', 'AA 건전지', '극세사 담요']},
                       {'task': 'receipt', 'lines': [{'names': ['CJ햇반210g', 'CJ햇반', '햇반'], 'like': ['햇반']},
                                                     {'names': ['봉투값'], 'like': []}]}):
              code, out = call(url, {'data': body}, account, wait=True)
              ok &= code == 200
              print(f'- `{json.dumps(body, ensure_ascii=False)}` → {code} `{json.dumps(out, ensure_ascii=False)[:300]}`  ')
          code, out = call(url, {'data': {'task': 'classify', 'name': 'x'}})
          ok &= code == 401
          print(f'- without sign-in → {code} (should be 401)  ')
          code, guest = call(f'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={key}', {'returnSecureToken': True})
          if code == 200:
              for body in ({'task': 'classify', 'name': '새로운이름테스트'}, {'task': 'credits'}):
                  code, out = call(url, {'data': body}, {'Authorization': 'Bearer ' + guest['idToken']})
                  ok &= code == 403
                  print(f'- a guest asks the fairy ({body["task"]}) → {code} (should be 403)  ')
          login = f'https://us-central1-{project}.cloudfunctions.net/login'
          code, out = call(login, {'data': {'provider': 'kakao', 'token': 'not-a-real-token'}}, wait=True)
          ok &= code == 401
          print(f'- login with a fake kakao token → {code} (should be 401: the provider refused it)  ')
          code, out = call(login, {'data': {'provider': 'naver', 'token': 'not-a-real-token'}}, wait=True)
          ok &= code == 401
          print(f'- login with naver → {code} (should be 401: naver login is off)  ')
          buy = f'https://us-central1-{project}.cloudfunctions.net/purchase'
          code, out = call(buy, {'data': {'product': 'dust_500', 'token': 'x' * 40}}, account, wait=True)
          ok &= code in (400, 503)
          print(f'- a made-up purchase token → {code} (should be refused: 400 not paid, or 503 while Play access is not set up)  ')
          if not ok: raise SystemExit(1)
          PY

      - name: Shared homes end to end (create, invite, join, the 2-person limit, rules, leave)
        working-directory: functions
        shell: bash
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          venv/bin/python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, time, urllib.request, urllib.error
          import firebase_admin
          from firebase_admin import auth, firestore
          project = os.environ['PROJECT']
          key = json.loads(os.environ['GSJ'])['client'][0]['api_key'][0]['current_key']
          firebase_admin.initialize_app(options={'projectId': project})
          db = firestore.client()

          def post(url, body, token=None):
              h = {'Content-Type': 'application/json'}
              if token: h['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(url, json.dumps(body).encode(), h)
              for _ in range(12):
                  try:
                      return 200, json.load(urllib.request.urlopen(req, timeout=60))
                  except urllib.error.HTTPError as e:
                      text = e.read().decode()[:300]
                      if e.code in (401, 403) and '<html' in text:
                          time.sleep(10); continue
                      return e.code, text

          def sign_in(uid, name):
              try: auth.update_user(uid, display_name=name)
              except auth.UserNotFoundError: auth.create_user(uid=uid, display_name=name)
              t = auth.create_custom_token(uid).decode()
              code, out = post(f'https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key={key}', {'token': t, 'returnSecureToken': True})
              assert code == 200, out
              return out['idToken']

          fn = f'https://us-central1-{project}.cloudfunctions.net/household'
          def call(tok, **data):
              code, out = post(fn, {'data': data}, tok)
              return code, out.get('result', {}) if isinstance(out, dict) else out

          def doc(tok, path, want=None):
              # New rules can take a minute or two to reach every server.
              for _ in range(18 if want else 1):
                  req = urllib.request.Request(f'https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents/{path}',
                                               headers={'Authorization': 'Bearer ' + tok})
                  try: urllib.request.urlopen(req, timeout=30); code = 200
                  except urllib.error.HTTPError as e: code = e.code
                  if code == want or want is None: return code
                  time.sleep(10)
              return code

          print('## Shared homes  ')
          a, b, c = sign_in('test:ci-a', 'CI A'), sign_in('test:ci-b', 'CI B'), sign_in('test:ci-c', 'CI C')
          for t in (a, b, c): call(t, action='leave')
          for u in ('test:ci-a', 'test:ci-b', 'test:ci-c'): db.collection('joinTries').document(u).delete()
          ok = True
          def check(label, got, want):
              global ok
              good = got == want
              ok &= good
              print(f'- {label}: {got} {"ok" if good else f"(want {want})"}  ')
          code, out = call(a, action='create', name='CI')
          check('create', code, 200); home = out.get('homeId')
          code, out = call(a, action='invite'); check('invite', code, 200); invite = out.get('code')
          check('B joins with the code', call(b, action='join', code=invite)[0], 200)
          check('the code works once (C tries the same one)', call(c, action='join', code=invite)[0], 404)
          check('a full home gives no more codes (free = 2)', call(a, action='invite')[0], 429)
          check('A reads the home', doc(a, f'homes/{home}', 200), 200)
          check('B reads the home', doc(b, f'homes/{home}', 200), 200)
          check('B reads its items', doc(b, f'homes/{home}/items/none', 404), 404)
          check('C reads the home (not a member)', doc(c, f'homes/{home}'), 403)
          check('C reads its items', doc(c, f'homes/{home}/items/none'), 403)
          check('A reads invites (functions only)', doc(a, f'invites/{invite}'), 403)
          check('B cannot remove the owner', call(b, action='remove', uid='test:ci-a')[0], 403)
          check('A (owner) removes B', call(a, action='remove', uid='test:ci-b')[0], 200)
          check('B no longer reads the home', doc(b, f'homes/{home}', 403), 403)
          # Wrong codes: C already tried one; after 8 in an hour the door stays shut.
          for n in range(7): call(c, action='join', code=f'00000{n}')
          check('C is stopped after 8 wrong codes', call(c, action='join', code='000009')[0], 409)
          db.collection('joinTries').document('test:ci-c').delete()
          for t in (a, b, c): call(t, action='leave')
          code, out = post(f'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={key}', {'returnSecureToken': True})
          check('a guest creates a home', call(out['idToken'], action='create')[0], 403)
          code, found = post(f'https://us-central1-{project}.cloudfunctions.net/barcode', {'data': {'code': '8801043015653'}}, out['idToken'])
          found = found.get('result', {}) if isinstance(found, dict) else found
          print(f'- barcode 8801043015653 → {code} `{json.dumps(found, ensure_ascii=False)[:120]}`  ')
          check('a food barcode has a name', code == 200 and bool(found.get('name')), True)
          d = sign_in('test:ci-d', 'CI D')
          code, cr = post(f'https://us-central1-{project}.cloudfunctions.net/decide', {'data': {'task': 'credits'}}, d)
          cr = cr.get('result', {}) if isinstance(cr, dict) else cr
          print(f'- credits for an account → {code} `{cr}`  ')
          check('an account has the free monthly credits', (code, cr.get('limit') if isinstance(cr, dict) else None), (200, 150))
          call(d, action='create', name='CI D')
          check('D deletes the account', call(d, action='deleteAccount')[0], 200)
          try:
              auth.get_user('test:ci-d'); gone = False
          except auth.UserNotFoundError:
              gone = True
          check('the sign-in is gone', gone, True)
          if not ok: raise SystemExit(1)
          PY
