name: Functions

# Deploys Cloud Functions (functions/) to homefairy-dev and smoke-tests them.
# The Jev key goes from the JEV_API_KEY Actions secret into Secret Manager;
# nothing secret is printed.
on:
  push:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

env:
  PROJECT: homefairy-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Icons match the app
        working-directory: app/packages/core
        run: dart pub get >/dev/null && dart run tool/export_icons.dart --check

      - name: Enable APIs (fails here if the project is not on Blaze or the account lacks rights)
        run: |
          gcloud services enable --project "$PROJECT" \
            cloudfunctions.googleapis.com run.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com secretmanager.googleapis.com eventarc.googleapis.com \
            identitytoolkit.googleapis.com firebaseappcheck.googleapis.com 2>&1 | tail -5

      - name: Jev key into Secret Manager
        env:
          JEV: ${{ secrets.JEV_API_KEY }}
        run: |
          if ! gcloud secrets describe JEV_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            gcloud secrets create JEV_API_KEY --project "$PROJECT" --replication-policy=automatic
          fi
          current=$(gcloud secrets versions access latest --secret=JEV_API_KEY --project "$PROJECT" 2>/dev/null || true)
          if [ "$current" != "$JEV" ]; then
            printf %s "$JEV" | gcloud secrets versions add JEV_API_KEY --project "$PROJECT" --data-file=- >/dev/null
            echo "secret: new version added"
          else
            echo "secret: unchanged"
          fi

      - name: Python environment for the functions
        working-directory: functions
        run: |
          python3 -m venv venv
          venv/bin/pip install -q -r requirements.txt
          venv/bin/python -c "import main" && echo "functions import ok"

      - name: Deploy
        run: npx -y firebase-tools deploy --only functions --project "$PROJECT" --non-interactive --force

      - name: Smoke test as an anonymous user
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, urllib.request, urllib.error
          project = os.environ['PROJECT']
          key = json.loads(os.environ['GSJ'])['client'][0]['api_key'][0]['current_key']
          tok = subprocess.run(['gcloud', 'auth', 'print-access-token'], capture_output=True, text=True).stdout.strip()

          def call(url, body, headers=None):
              req = urllib.request.Request(url, json.dumps(body).encode(), {'Content-Type': 'application/json', **(headers or {})})
              try:
                  return 200, json.load(urllib.request.urlopen(req, timeout=60))
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]

          print('## Functions smoke test  ')
          # Guests sign in anonymously; turn that sign-in method on if it is off.
          req = urllib.request.Request(
              f'https://identitytoolkit.googleapis.com/admin/v2/projects/{project}/config?updateMask=signIn.anonymous.enabled',
              json.dumps({'signIn': {'anonymous': {'enabled': True}}}).encode(),
              {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok, 'X-Goog-User-Project': project},
              method='PATCH')
          try:
              urllib.request.urlopen(req, timeout=30); print('- anonymous sign-in: on  ')
          except urllib.error.HTTPError as e:
              print(f'- anonymous sign-in: could not turn on (HTTP {e.code}) — enable it in Firebase console → Authentication  ')
          code, user = call(f'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={key}', {'returnSecureToken': True})
          if code != 200:
              print(f'- anonymous sign-up failed: HTTP {code}  '); raise SystemExit(1)
          auth = {'Authorization': 'Bearer ' + user['idToken']}
          url = f'https://us-central1-{project}.cloudfunctions.net/decide'
          for body in ({'task': 'classify', 'name': '타이레놀'}, {'task': 'classify', 'name': '청바지'},
                       {'task': 'find', 'query': '해열제', 'items': ['타이레놀', 'AA 건전지', '극세사 담요']}):
              code, out = call(url, {'data': body}, auth)
              print(f'- `{json.dumps(body, ensure_ascii=False)}` → {code} `{json.dumps(out, ensure_ascii=False)[:300]}`  ')
          code, out = call(url, {'data': {'task': 'classify', 'name': 'x'}})
          print(f'- without sign-in → {code} (should be 401)  ')
          PY
