name: App

# Every push: generated files and fonts up to date, analyze, tests, then a test APK
# (release mode for real speed, signed with the repo's sideload key) on Releases `android-latest`.
# Store builds (AAB with the upload key) are a separate workflow, run only after "릴리즈하자".
on:
  push:
    paths: ["app/**", "design/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generated files and fonts are up to date
        run: |
          flutter pub get
          dart run tool/generate.dart --check
          pip install -q fonttools
          python3 tool/build_fonts.py --check
          flutter gen-l10n
          git diff --exit-code -- lib/l10n || (echo "::error::lib/l10n is out of date. Run flutter gen-l10n and commit." && exit 1)

      - name: Analyze
        run: flutter analyze

      - name: Core tests
        working-directory: app/packages/core
        run: dart pub get && dart test

      - name: App tests
        run: flutter test --exclude-tags golden

      - name: Build test APK
        run: |
          set -o pipefail
          V="0.1.${{ github.run_number }}"
          flutter build apk --release --target-platform android-arm64 \
            --build-number ${{ github.run_number }} --build-name "$V" \
            --dart-define=APP_VERSION="$V-dev" 2>&1 | tee build.log
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/HomeFairy-dev-${{ github.run_number }}.apk"
          ls -la out

      - name: Show build errors
        if: failure()
        run: grep -E "error|Error|FAILURE|What went wrong" -A3 build.log | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: HomeFairy-apk
          path: app/out/*.apk

      - name: Publish to Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Home Fairy test build ${{ github.run_number }}" \
            --notes "Test APK (sideload key) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on the phone; it updates the previous test build."
