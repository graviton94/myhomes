name: App

# Every push: generated files and fonts up to date, analyze, tests, then a test APK
# (release mode for real speed, signed with the repo's sideload key) on Releases `android-latest`.
# Store builds (AAB with the upload key) are a separate workflow, run only after "릴리즈하자".
on:
  push:
    paths: ["app/**", "design/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generated files and fonts are up to date
        run: |
          flutter pub get
          dart run tool/generate.dart --check
          pip install -q fonttools
          python3 tool/build_fonts.py --check
          python3 tool/build_icons.py --check
          flutter gen-l10n
          git diff --exit-code -- lib/l10n || (echo "::error::lib/l10n is out of date. Run flutter gen-l10n and commit." && exit 1)

      - name: Core analyze and tests
        working-directory: app/packages/core
        run: dart pub get && dart analyze && dart test

      - name: Analyze
        run: flutter analyze

      - name: App tests
        run: flutter test --exclude-tags golden

      # Locked test key (android/keystore/sideload.jks.gpg), unlocked with the SIDELOAD_PASSPHRASE secret.
      # Every test APK must carry this key so it installs over the previous one.
      - name: Sideload signing key
        env:
          P: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          if [ -z "$P" ]; then echo "::error::SIDELOAD_PASSPHRASE secret is missing"; exit 1; fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/sideload.jks" android/keystore/sideload.jks.gpg 3<<<"$P"
          echo "HF_SIDELOAD_STORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      # Firebase settings for this package from google-services.json (public values),
      # passed as --dart-define so the app needs no google-services Gradle plugin.
      - name: Firebase settings
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/firebase.defines"
          import json, os
          g = json.loads(os.environ.get('GSJ') or '{}')
          if not g:
              raise SystemExit(0)
          c = next(c for c in g['client'] if c['client_info']['android_client_info']['package_name'] == 'io.github.graviton94.homefairy')
          print(f"--dart-define=FB_API_KEY={c['api_key'][0]['current_key']}")
          print(f"--dart-define=FB_APP_ID={c['client_info']['mobilesdk_app_id']}")
          print(f"--dart-define=FB_PROJECT_ID={g['project_info']['project_id']}")
          print(f"--dart-define=FB_SENDER_ID={g['project_info']['project_number']}")
          # Google sign-in needs the web client (type 3); Android clients (type 1) appear once SHA keys are registered.
          oauth = [o for cl in g['client'] for o in cl.get('oauth_client', [])]
          web = next((o['client_id'] for o in oauth if o.get('client_type') == 3), None)
          if web:
              print(f"--dart-define=GOOGLE_WEB_CLIENT_ID={web}")
          import sys
          print(f"Google sign-in: web client {'found' if web else 'MISSING'}, Android clients {sum(o.get('client_type') == 1 for o in oauth)}", file=sys.stderr)
          PY
          echo "Firebase settings: $(wc -l < "$RUNNER_TEMP/firebase.defines") values"

      # Kakao and Naver login keys. The Naver secret ships inside the app by the Naver SDK's design.
      - name: Login keys
        env:
          KAKAO: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          NAVER_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          echo "Kakao: $([ -n "$KAKAO" ] && echo set || echo missing), Naver: $([ -n "$NAVER_ID" ] && [ -n "$NAVER_SECRET" ] && echo set || echo missing)"
          if [ -n "$KAKAO" ]; then
            echo "--dart-define=KAKAO_NATIVE_APP_KEY=$KAKAO" >> "$RUNNER_TEMP/firebase.defines"
            echo "HF_KAKAO_NATIVE_APP_KEY=$KAKAO" >> "$GITHUB_ENV"
          fi
          if [ -n "$NAVER_ID" ] && [ -n "$NAVER_SECRET" ]; then
            echo "--dart-define=NAVER_ON=true" >> "$RUNNER_TEMP/firebase.defines"
            echo "HF_NAVER_CLIENT_ID=$NAVER_ID" >> "$GITHUB_ENV"
            echo "HF_NAVER_CLIENT_SECRET=$NAVER_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build test APK
        env:
          HF_SIDELOAD_PASSWORD: ${{ secrets.SIDELOAD_PASSPHRASE }}
        run: |
          set -o pipefail
          V="0.1.${{ github.run_number }}"
          flutter build apk --release --target-platform android-arm64 \
            --build-number ${{ github.run_number }} --build-name "$V" \
            --dart-define=APP_VERSION="$V-dev" $(cat "$RUNNER_TEMP/firebase.defines") 2>&1 | tee build.log
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/HomeFairy-dev-${{ github.run_number }}.apk"
          ls -la out

      - name: APK is signed with the sideload key
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs out/*.apk | tee certs.txt | grep -E "certificate DN|SHA-1"
          grep -qi "CN=Home Fairy sideload" certs.txt || (echo "::error::APK is not signed with the sideload key" && exit 1)

      - name: Show build errors
        if: failure()
        run: grep -E "error|Error|FAILURE|What went wrong" -A3 build.log | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: HomeFairy-apk
          path: app/out/*.apk

      - name: Publish to Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Home Fairy test build ${{ github.run_number }}" \
            --notes "Test APK (sideload key) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on the phone; it updates the previous test build."
