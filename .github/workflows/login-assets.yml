name: Login button assets

# Fetches the official Kakao, Naver and Google login button resources (the
# dev session cannot reach those sites) and commits them under
# design/login/official/ so the app can follow each brand guide.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/login-assets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Find and download
        run: |
          out=design/login/official
          mkdir -p "$out" /tmp/pages
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          get() { curl -sL -A "$ua" --max-time 40 -o "$2" -w '%{http_code}' "$1" || echo 000; }
          # Guide pages: list every image or archive they link, so the next pass can pick exact files.
          for page in \
            https://developers.kakao.com/docs/latest/ko/kakaologin/design-guide \
            https://developers.kakao.com/tool/resource/login \
            https://developers.naver.com/docs/login/bi/bi.md \
            https://developers.google.com/identity/branding-guidelines; do
            f=/tmp/pages/$(echo "$page" | md5sum | cut -c1-8)
            echo "== $(get "$page" "$f") $page"
            grep -oiE 'href="[^"]*(download|resource|zip)[^"]*"' "$f" | sort -u | head -20
            grep -oE '(https?:)?//[^"'"'"' )]+\.(zip|png|svg|PNG|SVG)|/[^"'"'"' )]+\.(zip|png|svg)' "$f" | sort -u | head -40
          done
          # Known resource locations; keep whichever answer.
          while read -r name url; do
            code=$(get "$url" "$out/$name")
            if [ "$code" != 200 ] || [ ! -s "$out/$name" ] || file "$out/$name" | grep -qi html; then rm -f "$out/$name"; fi
            echo "$code $name $url"
          done <<'EOF'
          naver_login_kr.zip https://developers.naver.com/inc/devcenter/downloads/bi/NAVER_login_KR.zip
          kakao-login-complete-ko.svg https://developers.kakao.com/tool/images/resource/preview/login-complete-ko.svg
          kakao-login-simple-ko.svg https://developers.kakao.com/tool/images/resource/preview/login-simple-ko.svg
          kakao-login-complete-en.svg https://developers.kakao.com/tool/images/resource/preview/login-complete-en.svg
          kakao-login-standard-ko.png https://developers.kakao.com/docs/latest/ko/assets/style/img/login_button_standard_ko.png
          EOF
          for z in "$out"/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "${z%.zip}" && rm "$z"; done
          find "$out" -name .DS_Store -delete
          find "$out" -type f | grep -v google-signin | head -80
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add design/login/official
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Official login button resources"
          git push
